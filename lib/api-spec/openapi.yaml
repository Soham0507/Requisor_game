openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Brandable game catalog
  - name: branding-drafts
    description: In-progress branding customizations for a game
  - name: custom-ui-requests
    description: Requests for a fully custom UI build
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List the brandable game catalog
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /games/{slug}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a single game by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /branding-drafts:
    post:
      operationId: upsertBrandingDraft
      tags: [branding-drafts]
      summary: Create or update a branding draft for a game
      description: Upserts by the combination of gameId + draftToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBrandingDraftRequest"
      responses:
        "200":
          description: The saved branding draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingDraft"
  /branding-drafts/{id}:
    get:
      operationId: getBrandingDraft
      tags: [branding-drafts]
      summary: Get a branding draft by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The branding draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingDraft"
        "404":
          description: Draft not found
  /branding-drafts/{id}/finalize:
    post:
      operationId: finalizeBrandingDraft
      tags: [branding-drafts]
      summary: Finalize a branding draft and create a pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeBrandingDraftRequest"
      responses:
        "200":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Draft not found
  /custom-ui-requests:
    post:
      operationId: createCustomUiRequest
      tags: [custom-ui-requests]
      summary: Submit a request for a fully custom UI build
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomUiRequestRequest"
      responses:
        "200":
          description: The created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomUiRequest"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BrandSupport:
      type: string
      enum: [full, chrome_only]
    Game:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        tagline:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        previewBasePath:
          type: string
          nullable: true
        brandSupport:
          $ref: "#/components/schemas/BrandSupport"
        defaultPrimaryColor:
          type: string
        defaultSecondaryColor:
          type: string
        defaultAccentColor:
          type: string
        defaultLogoUrl:
          type: string
          nullable: true
        defaultHeading:
          type: string
        priceCents:
          type: integer
      required:
        - id
        - slug
        - name
        - tagline
        - brandSupport
        - defaultPrimaryColor
        - defaultSecondaryColor
        - defaultAccentColor
        - defaultHeading
        - priceCents
    UpsertBrandingDraftRequest:
      type: object
      properties:
        gameId:
          type: string
        draftToken:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        logoDataUrl:
          type: string
          nullable: true
        heading:
          type: string
        tagline:
          type: string
          nullable: true
      required:
        - gameId
        - draftToken
        - primaryColor
        - secondaryColor
        - accentColor
        - heading
    BrandingDraft:
      type: object
      properties:
        id:
          type: string
        gameId:
          type: string
        draftToken:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        logoDataUrl:
          type: string
          nullable: true
        heading:
          type: string
        tagline:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, finalized]
      required:
        - id
        - gameId
        - draftToken
        - primaryColor
        - secondaryColor
        - accentColor
        - heading
        - status
    FinalizeBrandingDraftRequest:
      type: object
      properties:
        contactEmail:
          type: string
          nullable: true
    Order:
      type: object
      properties:
        id:
          type: string
        brandingDraftId:
          type: string
        gameId:
          type: string
        status:
          type: string
          enum: [pending_payment]
        totalAmountCents:
          type: integer
        contactEmail:
          type: string
          nullable: true
      required:
        - id
        - brandingDraftId
        - gameId
        - status
        - totalAmountCents
    CreateCustomUiRequestRequest:
      type: object
      properties:
        gameId:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        message:
          type: string
      required:
        - name
        - email
        - message
    CustomUiRequest:
      type: object
      properties:
        id:
          type: string
        gameId:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        message:
          type: string
      required:
        - id
        - name
        - email
        - message

